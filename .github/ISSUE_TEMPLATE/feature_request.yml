name: 💡 Feature Request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make WACT better? Tell us!
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case behind your request.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What solution do you propose?
      description: What should it look like? Any alternatives you've considered?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does it belong to?
      options:
        - API Testing
        - UI Testing
        - Performance Testing
        - AI Features
        - Data Factory / Variables
        - CI/CD & Integration
        - Documentation
        - Other
